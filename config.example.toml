# Beispiel-Config für annotate.py
# Kopieren nach ~/.config/annotate/config.toml
# Fehlt die Datei oder ein Wert, nimmt das Tool sinnvolle Standardwerte.

[tools]
# Reihenfolge der Werkzeuge; das Werkzeug an Position i bekommt die Taste von tool_i ([keys]).
# Namen: freehand line arrow rect ellipse text
order = ["freehand", "line", "arrow", "rect", "ellipse", "text"]
# Werkzeug beim Start
default = "freehand"

[colors]
# Reihenfolge der Farbleiste = Reihenfolge der Kürzel Shift+A S D F G Z X C V B.
# Namen: black red green yellow blue magenta cyan white,
#        dieselben mit "bright_" davor (z. B. "bright_red"), und "foreground".
# Die Farbwerte selbst kommen aus der Alacritty-Config.
order = ["yellow", "magenta", "cyan", "green", "red", "blue", "white", "bright_black", "foreground"]
# Farbe beim Start (gleiche Namen wie oben)
default = "yellow"

# Whiteboard mit hellem Hintergrund (z. B. Papierweiß, Strg+B): Die Alacritty-Farben sind für
# dunklen Hintergrund gemacht, darum zeigt das Tool sie dort automatisch abgedunkelt (gleicher
# Farbton, Kontrast mindestens 3.0). Gespeichert wird die Grundfarbe; zurück auf dunklem
# Hintergrund ist alles wieder wie vorher. Hier lassen sich einzelne helle Varianten
# selbst festlegen: Name wie oben = "#rrggbb" (oder ein anderer Farbname).
# Ansehen, was automatisch herauskommt: python colors.py
[colors.light]
# yellow = "#8f5e15"
# foreground = "#343b58"

[size]
# Größe in 4 Stufen, Alt+A S D F wählt Stufe 1-4 (auch per Klick auf die Leiste).
# Gilt als Strichstärke für Formen und als Schriftgröße für Text, Werte in Pixeln.
default = 2                  # Stufe beim Start
stroke = [2, 4, 8, 12]       # Strichstärke, je 1-100
text = [16, 28, 40, 64]      # Schriftgröße, je 6-300

[ui]
# Farben der Leiste und der Einblendungen. Namen wie in [colors] plus "background"
# (Hintergrund aus Alacritty colors.primary) oder direkt "#rrggbb".
bar_background = "background"
bar_foreground = "foreground"   # Symbole, Rahmen, Beschriftung
bar_accent = "blue"             # Hervorhebungen, z. B. Tasten in der Übersicht (?)
bar_heading = "magenta"         # Überschriften, z. B. WERKZEUGE in der Übersicht (?)
bar_opacity = 0.9               # Deckkraft des Hintergrunds, 0-1
# Kurze Meldungen (Gespeichert, Kopiert, Fehler): "dunst" (notify-send) oder "toast"
# (Einblendung im Fenster). Fehlt notify-send, wird automatisch "toast" genommen.
messages = "dunst"
# Nachfragen (z. B. "Speichern?" beim Schließen des Whiteboards): "rofi" (rofi -dmenu,
# Auswahl mit Pfeiltasten oder Fuzzy-Eingabe) oder "qt" (Qt-Dialog). Fehlt rofi: "qt".
dialogs = "rofi"
# Eigenes rofi-Theme für die Nachfragen; ohne Angabe rofi/annotate.rasi im Projekt
# (lädt zusätzlich ~/.config/rofi/colors.rasi, falls vorhanden)
# rofi_theme = "~/.config/rofi/themes/annotate.rasi"

[board]
# Whiteboard (python annotate.py --board): Hintergrundfarbe. Name wie in [colors],
# "background" (Alacritty-Hintergrund) oder "#rrggbb"
background = "background"
# Hintergründe zum Durchblättern mit Strg+B / Strg+Shift+B (Undo-Schritt, wird mitgespeichert).
# Namen wie oben. Steht der Start-Hintergrund nicht in der Liste, geht es beim ersten los.
backgrounds = ["background", "#f8f6f0"]   # Alacritty (dunkel), Papierweiß (hell)

[rect]
# Eckenradius neuer Rechtecke in Pixeln (0 = spitze Ecken, höchstens 200).
# Bei kleinen Rechtecken verkleinert sich die Rundung von selbst. Jedes Rechteck
# speichert seinen Radius; eine Änderung hier gilt nur für neu gezeichnete.
radius = 8          # Screenshot-Modus
radius_board = 20   # Whiteboard

[move]
# Ausgewähltes Element mit h j k l verschieben: Bildschirm-Pixel pro Tastendruck (1-500)
step = 10          # h j k l
step_fine = 1      # Shift+h j k l

[output]
# Ordner für Strg+S (Zeichnung) und Strg+E (Export), PNG mit Zeitstempel. ~ ist erlaubt.
# Standard: ~/Pictures/annotate
dir = "~/Pictures/annotate"

[history]
# Verlauf: Jeder Screenshot, auf dem du etwas änderst, wird automatisch als bearbeitbares
# PNG gespeichert (kurz nach jeder Änderung und beim Beenden) und lässt sich mit ← / →
# wieder aufrufen. Screenshots ohne Änderung und Whiteboards landen nicht im Verlauf.
# Ein Eintrag enthält den Screenshot zweimal (fertig + roh), bei 4K etwa 2-6 MB;
# 100 Einträge also bis zu einige hundert MB.
enabled = true
dir = "~/.local/share/annotate/history"
keep = 100          # so viele Einträge bleiben, ältere werden beim Anlegen eines neuen gelöscht (1-100000)

[keys]
# Aktion = Taste. Nur eintragen, was vom Standard abweichen soll; hier stehen alle Standardwerte.
# Schreibweise wie in Qt-Menüs: "r", "shift+r", "ctrl+z", "alt+a", "tab", "f1".
# Mehrere Tasten für eine Aktion als Liste: ["delete", "backspace"].
# "" = Aktion ohne Taste. Esc ist fest (Texteingabe beenden bzw. Tool beenden).
# Doppelt belegt: Was hier steht, gewinnt; die andere Aktion verliert ihre Taste (Warnung im Terminal).
tool_select = "w"            # Auswahl-Werkzeug (steht in der Leiste immer vorne)
delete = ["delete", "backspace"]   # Auswahl löschen; Liste = mehrere Tasten
undo = "r"
redo = "shift+r"
color_next = "tab"
color_prev = "shift+tab"
copy_quit = "return"       # Bild in die Zwischenablage und beenden (Whiteboard: nur kopieren)
copy_path_quit = "shift+return"  # speichern wie Strg+S, absoluten Pfad kopieren, beenden (Whiteboard: offen)
quit = "ctrl+q"            # beenden; im Whiteboard die einzige Taste dafür
zoom_reset = "ctrl+0"      # Whiteboard: Zoom zurück auf 100 %
overview = "ctrl+w"        # Whiteboard: Übersicht (alles einpassen), erneut = zurück
background_next = "ctrl+b"        # Whiteboard: nächster Hintergrund aus [board] backgrounds
background_prev = "ctrl+shift+b"  # Whiteboard: voriger Hintergrund
# Auswahl verschieben (Schrittweiten in [move]), Shift = fein
move_left = "h"
move_down = "j"
move_up = "k"
move_right = "l"
move_left_fine = "shift+h"
move_down_fine = "shift+j"
move_up_fine = "shift+k"
move_right_fine = "shift+l"
copy_image = "ctrl+c"      # Bild in die Zwischenablage, offen bleiben
save = "ctrl+s"            # bearbeitbare Zeichnung speichern (PNG mit eingebetteten Daten)
export_png = "ctrl+e"      # sauberes PNG ohne Bearbeitungsdaten
history_prev = "left"      # Verlauf: älterer Screenshot
history_next = "right"     # Verlauf: neuerer Screenshot
help = "shift+?"           # Übersicht aller Tastenkürzel (? = Shift+/ auf US-Layout)
# Werkzeug-Plätze: tool_i wählt das Werkzeug an Position i von [tools] order (tool_7-9 ohne Standard)
tool_1 = "a"
tool_2 = "s"
tool_3 = "d"
tool_4 = "f"
tool_5 = "g"
tool_6 = "t"
# Farb-Plätze: color_i wählt Feld i der Farbleiste (color_11-17 ohne Standard)
color_1 = "shift+a"
color_2 = "shift+s"
color_3 = "shift+d"
color_4 = "shift+f"
color_5 = "shift+g"
color_6 = "shift+z"
color_7 = "shift+x"
color_8 = "shift+c"
color_9 = "shift+v"
color_10 = "shift+b"
# Größen-Stufen ([size])
size_1 = "alt+a"
size_2 = "alt+s"
size_3 = "alt+d"
size_4 = "alt+f"
