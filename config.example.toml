# Example config for slate.py
# Copy to ~/.config/slate/config.toml
# If the file or a value is missing, the tool uses sensible defaults.

[tools]
# Order of the tools; the tool at position i gets the key of tool_i ([keys]).
# Names: freehand line arrow rect ellipse text
order = ["freehand", "line", "arrow", "rect", "ellipse", "text"]
# Tool at startup
default = "freehand"

[colors]
# Order of the color bar = order of the shortcuts Shift+A S D F G Z X C V B.
# Names: black red green yellow blue magenta cyan white,
#        the same with "bright_" in front (e.g. "bright_red"), and "foreground".
# The color values themselves come from the Alacritty config.
order = ["yellow", "magenta", "cyan", "green", "red", "blue", "white", "bright_black", "foreground"]
# Color at startup (same names as above)
default = "yellow"

# Whiteboard with a light background (e.g. paper white, Ctrl+B): the Alacritty colors are made
# for a dark background, so the tool automatically shows them darkened there (same hue,
# contrast at least 3.0). The base color is what gets saved; back on a dark background
# everything is as before. Here you can set individual light variants yourself:
# name as above = "#rrggbb" (or another color name).
# See what comes out automatically: python colors.py
[colors.light]
# yellow = "#8f5e15"
# foreground = "#343b58"

[size]
# Size in 4 levels, Alt+A S D F picks level 1-4 (also by clicking the bar).
# Used as stroke width for shapes and as font size for text, values in pixels.
default = 2                  # level at startup
stroke = [2, 4, 8, 12]       # stroke width, each 1-100
text = [16, 28, 40, 64]      # font size, each 6-300

[ui]
# Colors of the bar and the overlays. Names as in [colors] plus "background"
# (background from Alacritty colors.primary) or directly "#rrggbb".
bar_background = "background"
bar_foreground = "foreground"   # icons, frames, labels
bar_accent = "blue"             # highlights, e.g. keys in the overview (?)
bar_heading = "magenta"         # headings, e.g. TOOLS in the overview (?)
bar_opacity = 0.9               # opacity of the background, 0-1
show_bar = false                # show the bar at startup in screenshot mode? (b toggles)
show_bar_board = true           # the same in the whiteboard
# Short messages (saved, copied, errors): "dunst" (notify-send) or "toast"
# (overlay in the window). If notify-send is missing, "toast" is used automatically.
messages = "dunst"
# Prompts (e.g. "Save?" when closing the whiteboard): "rofi" (rofi -dmenu,
# choose with arrow keys or fuzzy input) or "qt" (Qt dialog). If rofi is missing: "qt".
dialogs = "rofi"
# Own rofi theme for the prompts; if not set, rofi/slate.rasi in the project
# (additionally loads ~/.config/rofi/colors.rasi, if it exists)
# rofi_theme = "~/.config/rofi/themes/slate.rasi"

[board]
# Whiteboard (python slate.py --board): background color. Name as in [colors],
# "background" (Alacritty background) or "#rrggbb"
background = "background"
# Backgrounds to cycle through with Ctrl+B / Ctrl+Shift+B (undo step, saved with the drawing).
# Names as above. If the start background is not in the list, cycling starts with the first one.
backgrounds = ["background", "#f8f6f0"]   # Alacritty (dark), paper white (light)

[rect]
# Corner radius of new rectangles in pixels (0 = sharp corners, at most 200).
# For small rectangles the rounding shrinks by itself. Every rectangle
# stores its radius; a change here only applies to newly drawn ones.
radius = 8          # screenshot mode
radius_board = 20   # whiteboard

[move]
# Move the selected element with h j k l: screen pixels per key press (1-500)
step = 10          # h j k l
step_fine = 1      # Shift+h j k l

[output]
# Folder for Ctrl+S (drawing) and Ctrl+E (export), PNG with a timestamp. ~ is allowed.
# Default: ~/Pictures/slate
dir = "~/Pictures/slate"

[pointer]
# Pointing while teaching: e = spotlight, Shift+E = magnifier. Radii in pixels for a
# 1080 px screen, they grow on larger monitors (4K = double), each 20-600.
spotlight_radius = 90   # circle that stays bright with the spotlight
lens_radius = 100       # size of the magnifier
spotlight_dim = 45      # darkening outside the spotlight in percent (0-100)
lens_zoom = 2.0         # magnification of the magnifier (1.1-10)

[history]
# History: every screenshot you change something on is saved automatically as an editable
# PNG (shortly after each change and when quitting) and can be brought back with ← / →.
# Screenshots without changes and whiteboards do not end up in the history.
# An entry contains the screenshot twice (finished + raw), about 2-6 MB at 4K;
# so 100 entries take up to a few hundred MB.
enabled = true
dir = "~/.local/share/slate/history"
keep = 100          # this many entries stay, older ones get deleted when a new one is created (1-100000)

[keys]
# Action = key. Only add what should differ from the default; all default values are listed here.
# Spelling as in Qt menus: "r", "shift+r", "ctrl+z", "alt+a", "tab", "f1".
# Several keys for one action as a list: ["delete", "backspace"].
# "" = action without a key. Esc is fixed (end text input or quit the tool).
# Bound twice: what is written here wins; the other action loses its key (warning in the terminal).
tool_select = "w"            # select tool (always first in the bar)
delete = ["delete", "backspace"]   # delete the selection; list = several keys
undo = "r"
redo = "shift+r"
color_next = "tab"
color_prev = "shift+tab"
copy_quit = "return"       # image to the clipboard and quit (whiteboard: only copy)
copy_path_quit = "shift+return"  # save like Ctrl+S, copy the absolute path, quit (whiteboard: stays open)
quit = "ctrl+q"            # quit; in the whiteboard the only key for it
zoom_reset = "ctrl+0"      # whiteboard: zoom back to 100 %
overview = "ctrl+w"        # whiteboard: overview (fit everything), again = back
background_next = "ctrl+b"        # whiteboard: next background from [board] backgrounds
background_prev = "ctrl+shift+b"  # whiteboard: previous background
# Move the selection (step sizes in [move]), Shift = fine
move_left = "h"
move_down = "j"
move_up = "k"
move_right = "l"
move_left_fine = "shift+h"
move_down_fine = "shift+j"
move_up_fine = "shift+k"
move_right_fine = "shift+l"
copy_image = "ctrl+c"       # with a selection: copy elements, otherwise the image (stays open)
paste = "ctrl+v"            # paste copied elements at the mouse (also from another window)
duplicate = "ctrl+d"        # duplicate the selection (slightly offset)
save = "ctrl+s"            # save the editable drawing (PNG with embedded data)
export_png = "ctrl+e"      # clean PNG without editing data
history_prev = "left"      # history: older screenshot
history_next = "right"     # history: newer screenshot
help = "shift+?"           # overview of all shortcuts (? = Shift+/ on the US layout)
toggle_bar = "b"           # show/hide the bar
tool_blur = "z"            # blur tool (pixelate), screenshot mode only
select_all = "ctrl+a"      # select all
raise = "ctrl+up"                  # bring the selection one step forward
lower = "ctrl+down"                # send the selection one step backward
rotate_left = "q"                  # rotate the selection 5° counterclockwise (blur and markers stay)
rotate_right = "shift+q"           # rotate the selection 5° clockwise
raise_top = "ctrl+shift+up"        # bring the selection to the front
lower_bottom = "ctrl+shift+down"   # send the selection to the back
tool_marker = "c"          # marker (numbered circles); press again: 1 2 3 / A B C
crop = "y"                 # draw a crop; Esc meanwhile: remove the crop (screenshot mode only)
spotlight = "e"            # pointing: spotlight on/off (everything darkened except around the mouse)
magnifier = "shift+e"      # pointing: magnifier on/off
# Tool slots: tool_i picks the tool at position i of [tools] order (tool_7-9 without a default)
tool_1 = "a"
tool_2 = "s"
tool_3 = "d"
tool_4 = "f"
tool_5 = "g"
tool_6 = "t"
# Color slots: color_i picks field i of the color bar (color_11-17 without a default)
color_1 = "shift+a"
color_2 = "shift+s"
color_3 = "shift+d"
color_4 = "shift+f"
color_5 = "shift+g"
color_6 = "shift+z"
color_7 = "shift+x"
color_8 = "shift+c"
color_9 = "shift+v"
color_10 = "shift+b"
# Size levels ([size])
size_1 = "alt+a"
size_2 = "alt+s"
size_3 = "alt+d"
size_4 = "alt+f"
